# 上架 DSH 插件市场的条目文件（模板）
#
# 用法：
#   1. 把本目录推到公开仓库 https://github.com/<owner>/<repo>，仓库根目录就是插件根目录，
#      并给仓库打上 topic：dsh-plugin
#   2. 仓库创建满 1 天后，fork awesome-dsh-plugin/awesome-dsh-plugin
#   3. 新增 data/plugins/<owner>__<repo>.yml（文件名 = 仓库 slug，两个下划线）
#   4. 提 PR；合并后 https://awesome-dsh-plugin.com 与 dshmarket 通常一天内生效
#
# 校验要求（上游 CI）：
#   - 仓库 package.json 必须声明 dsh.bundle（本插件已满足：见 package.json 的 dsh.bundle.patch）
#   - url 必须与仓库地址完全一致；name 为 owner/repo
#   - category 只能取：agi ui usage theme model identity session memory tools wsl
#     browser vision voice docs skill workflow git notify dev security remote market fun
#   - description.en 必填；含 ": " 时必须加引号（下面已经用引号包住）
#   - 只提交这一个文件，不要手改生成的 README

url: https://github.com/KunWu1980/dsh-douyin-kb
name: KunWu1980/dsh-douyin-kb
category: tools
description:
  en: 'You paste a Douyin video link (easy to copy from the Douyin PC app); the plugin transcribes the video into text with timestamps and imports it into Obsidian automatically. Made for DeepSeek Harness and for beginners building a personal knowledge base.'
  zh: '一个简单的人工提供抖音链接（可通过抖音PC客户端获得），由本插件自动将视频内容转化文字记录，并自动导入到Obsidian中，适用于harness、个人知识库搭建初学者上手。'
# 可选：GitHub 托管的位图图标（不写则回退到作者头像）
# icon: https://raw.githubusercontent.com/OWNER/REPO/main/assets/icon-180.png
